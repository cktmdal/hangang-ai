<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>손그림 그래프 - 집/학교 기본 커스텀 탐색기</title>
  <style>
    :root {
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --primary: #4f46e5;
      --dfs-color: #0284c7;
      --bfs-color: #16a34a;
      --time-color: #d97706;
      --dist-color: #059669;
      --active-node: #f97316;
      --target-node: #ef4444;
      --text-main: #0f172a;
      --text-sub: #64748b;
      --border: #e2e8f0;
    }

    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      margin: 0;
      padding: 24px;
      background-color: var(--bg-color);
      color: var(--text-main);
    }

    h2 { margin-top: 0; font-size: 22px; }

    .container {
      display: flex;
      gap: 24px;
      align-items: flex-start;
    }

    /* 제어 패널 */
    .control-panel {
      width: 380px;
      background: var(--card-bg);
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      border: 1px solid var(--border);
      max-height: 88vh;
      overflow-y: auto;
    }

    .panel-section {
      margin-bottom: 20px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 16px;
    }

    .panel-section h3 {
      margin-top: 0;
      font-size: 15px;
      color: var(--primary);
    }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .btn-row {
      display: flex;
      gap: 8px;
    }

    button {
      flex: 1;
      padding: 9px 6px;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
      color: white;
    }

    .btn-dfs { background: var(--dfs-color); }
    .btn-bfs { background: var(--bfs-color); }
    .btn-time { background: var(--time-color); }
    .btn-dist { background: var(--dist-color); }
    .btn-step { background: var(--primary); }
    .btn-auto { background: #8b5cf6; }
    .btn-reset { background: #ef4444; }
    .btn-add { background: #0d9488; }

    button:disabled {
      background: #cbd5e1 !important;
      cursor: not-allowed;
    }

    /* 입력 폼 스타일 */
    .input-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      font-size: 12px;
    }

    .input-row {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .input-row input, .input-row select {
      padding: 6px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 12px;
      flex: 1;
      width: 100%;
    }

    .editor-list-item {
      display: flex;
      gap: 4px;
      align-items: center;
      margin-bottom: 6px;
    }

    .editor-list-item input {
      padding: 4px;
      font-size: 11px;
      border: 1px solid var(--border);
      border-radius: 4px;
    }

    .editor-list-item span {
      font-size: 11px;
      font-weight: bold;
    }

    .btn-del {
      background: #ef4444;
      padding: 4px 8px;
      font-size: 11px;
      flex: none;
    }

    /* 현황 상자 */
    .status-box {
      background: #f1f5f9;
      padding: 12px;
      border-radius: 10px;
      font-size: 12px;
    }

    .status-box div { margin-bottom: 4px; }
    .status-val { font-weight: bold; color: var(--primary); }

    /* 트리 패널 */
    .tree-panel {
      flex: 1;
      background: var(--card-bg);
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      border: 1px solid var(--border);
      text-align: center;
    }

    .info-card {
      background: #eff6ff;
      border-left: 4px solid var(--primary);
      padding: 10px 14px;
      border-radius: 0 8px 8px 0;
      font-size: 13px;
      color: #1e40af;
      margin-bottom: 16px;
      text-align: left;
      font-weight: 600;
    }

    #graph-svg {
      width: 100%;
      min-height: 560px;
      cursor: crosshair;
      background-color: #fafafa;
      border-radius: 12px;
    }

    /* SVG 스타일 */
    .edge-line { stroke: #cbd5e1; stroke-width: 3; }
    .edge-label { font-size: 10px; fill: var(--text-sub); text-anchor: middle; font-weight: 600; }

    .node-circle {
      fill: #ffffff;
      stroke: #a3c2f0;
      stroke-width: 3px;
      transition: all 0.3s;
    }

    .node-circle.start { fill: #4f46e5; stroke: #312e81; }
    .node-circle.target { fill: var(--target-node); stroke: #991b1b; }
    .node-circle.visited { fill: var(--active-node); stroke: #c2410c; }
    .node-circle.current { fill: #facc15; stroke: #ca8a04; stroke-width: 5px; }

    .node-text {
      font-size: 11px;
      font-weight: 700;
      fill: var(--text-main);
      text-anchor: middle;
      dominant-baseline: middle;
      pointer-events: none;
    }
    .node-text.white { fill: #ffffff; }

    .order-badge {
      font-size: 11px;
      font-weight: 800;
      fill: var(--active-node);
      text-anchor: middle;
      pointer-events: none;
    }

    .temp-point {
      fill: #ef4444;
      stroke: #ffffff;
      stroke-width: 2px;
      animation: pulse 1s infinite alternate;
    }

    @keyframes pulse {
      from { r: 6px; opacity: 0.6; }
      to { r: 10px; opacity: 1; }
    }
  </style>
</head>
<body>

<h2>🏡 커스텀 경로 탐색기 (초기화 시 집-학교만 유지)</h2>

<div class="container">
  <!-- 제어 패널 -->
  <div class="control-panel">
    
    <!-- 1. 탐색 실행 -->
    <div class="panel-section">
      <h3>⚙️ 탐색 실행</h3>
      <div class="btn-group">
        <div class="btn-row">
          <button class="btn-dfs" onclick="selectAlgorithm('DFS')">DFS (깊이)</button>
          <button class="btn-bfs" onclick="selectAlgorithm('BFS')">BFS (너비)</button>
        </div>
        <div class="btn-row">
          <button class="btn-time" onclick="selectAlgorithm('TIME')">⏱️ 최단 시간 (자동)</button>
          <button class="btn-dist" onclick="selectAlgorithm('DIST')">📏 최단 거리 (자동)</button>
        </div>
        <div class="btn-row">
          <button id="btn-step" class="btn-step" onclick="nextStep()" disabled>▶ 한 단계씩</button>
          <button id="btn-auto" class="btn-auto" onclick="toggleAuto()" disabled>⏩ 자동 재생</button>
        </div>
        <button class="btn-reset" onclick="resetToInitial()">🧹 전체 초기화 (집, 학교만 남김)</button>
      </div>
    </div>

    <!-- 2. 장소(노드) 추가 -->
    <div class="panel-section">
      <h3>📍 새 장소 추가하기 (클릭하여 좌표 지정)</h3>
      <div class="input-group">
        <div class="input-row">
          <input type="text" id="new-node-name" placeholder="장소 이름 (예: 도서관)">
          <select id="new-node-type">
            <option value="normal">일반 장소</option>
            <option value="start">출발지 (시작)</option>
            <option value="target">목적지 (도착)</option>
          </select>
        </div>
        <div class="input-row">
          <input type="number" id="new-node-x" placeholder="X 좌표" value="300" readonly style="background:#f1f5f9;">
          <input type="number" id="new-node-y" placeholder="Y 좌표" value="220" readonly style="background:#f1f5f9;">
          <button class="btn-add" onclick="addNewNode()">장소 추가</button>
        </div>
        <span style="font-size: 11px; color: #64748b;">👉 지도의 원하는 위치를 마우스로 클릭하면 좌표가 자동 채워집니다.</span>
      </div>
    </div>

    <!-- 3. 장소 간 연결 설정 -->
    <div class="panel-section">
      <h3>✏️ 장소 간 연결 및 시간/거리 입력</h3>
      <div class="input-group">
        <div class="input-row">
          <select id="from-node"></select> ➔ <select id="to-node"></select>
        </div>
        <div class="input-row">
          <input type="number" id="input-dist" placeholder="거리(km)" step="0.1" value="0.5">
          <input type="number" id="input-time" placeholder="시간(분)" value="5">
          <button class="btn-add" onclick="addEdge()">연결 설정</button>
        </div>
      </div>
    </div>

    <!-- 4. 등록된 장소 목록 편집 -->
    <div class="panel-section">
      <h3>🏢 등록된 장소 목록</h3>
      <div id="node-editor-list"></div>
    </div>

    <!-- 5. 등록된 이동 경로 목록 편집 -->
    <div class="panel-section">
      <h3>📜 등록된 이동 경로 목록</h3>
      <div id="edge-editor-list"></div>
    </div>

    <!-- 6. 상태 표시 -->
    <div class="status-box">
      <div>선택 알고리즘: <span id="algo-type" class="status-val">선택되지 않음</span></div>
      <div>현재 위치: <span id="current-node" class="status-val">-</span></div>
      <div>방문 경로: <span id="path-history" class="status-val">-</span></div>
      <div>실적 정보: <span id="total-cost" class="status-val">-</span></div>
    </div>

  </div>

  <!-- 트리 패널 -->
  <div class="tree-panel">
    <div id="info-card" class="info-card">💡 지도에서 위치를 클릭해 새 장소를 만들고 장소 간 경로를 연결해보세요!</div>
    <svg id="graph-svg" onclick="handleSvgClick(event)"></svg>
  </div>
</div>

<script>
  // 기본 '집'과 '학교'만 갖고 시작하는 노드 객체
  let nodes = {
    '집': { x: 300, y: 50, type: 'start' },
    '학교': { x: 300, y: 490, type: 'target' }
  };

  // 기본 간선은 완전히 비워둔 채 시작
  let edges = [];

  let tempClickCoords = null;
  let adjList = {};
  let currentAlgo = null;
  let steps = [];
  let stepIndex = 0;
  let timer = null;

  // 전체 초기화 (집, 학교만 두고 모두 삭제)
  function resetToInitial() {
    nodes = {
      '집': { x: 300, y: 50, type: 'start' },
      '학교': { x: 300, y: 490, type: 'target' }
    };
    edges = [];
    tempClickCoords = null;
    resetStateOnly();
  }

  function handleSvgClick(event) {
    const svg = document.getElementById('graph-svg');
    const pt = svg.createSVGPoint();
    
    pt.x = event.clientX;
    pt.y = event.clientY;
    
    const cursorPt = pt.matrixTransform(svg.getScreenCTM().inverse());
    const x = Math.round(cursorPt.x);
    const y = Math.round(cursorPt.y);

    tempClickCoords = { x, y };

    document.getElementById('new-node-x').value = x;
    document.getElementById('new-node-y').value = y;

    drawGraph();
  }

  function buildAdjList() {
    adjList = {};
    Object.keys(nodes).forEach(v => adjList[v] = []);
    edges.forEach(e => {
      if (nodes[e.from] && nodes[e.to]) {
        adjList[e.from].push({ to: e.to, dist: e.dist, time: e.time });
        adjList[e.to].push({ to: e.from, dist: e.dist, time: e.time });
      }
    });
  }

  function drawGraph() {
    buildAdjList();
    updateUIControls();

    const svg = document.getElementById('graph-svg');
    svg.innerHTML = '';
    svg.setAttribute('viewBox', '0 0 600 560');

    // 간선 그리기
    edges.forEach(e => {
      const p1 = nodes[e.from];
      const p2 = nodes[e.to];
      if (!p1 || !p2) return;

      const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      line.setAttribute('x1', p1.x); line.setAttribute('y1', p1.y);
      line.setAttribute('x2', p2.x); line.setAttribute('y2', p2.y);
      line.setAttribute('class', 'edge-line');
      svg.appendChild(line);

      const midX = (p1.x + p2.x) / 2;
      const midY = (p1.y + p2.y) / 2 - 6;
      const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      text.setAttribute('x', midX); text.setAttribute('y', midY);
      text.setAttribute('class', 'edge-label');
      text.textContent = `${e.dist}km / ${e.time}분`;
      svg.appendChild(text);
    });

    // 노드 그리기
    Object.keys(nodes).forEach(name => {
      const n = nodes[name];
      const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');

      let circleClass = 'node-circle';
      let textClass = 'node-text';
      if (n.type === 'start') { circleClass += ' start'; textClass += ' white'; }
      if (n.type === 'target') { circleClass += ' target'; textClass += ' white'; }

      const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      circle.setAttribute('cx', n.x); circle.setAttribute('cy', n.y); circle.setAttribute('r', 24);
      circle.setAttribute('class', circleClass);
      circle.setAttribute('id', `node-${name}`);

      const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      text.setAttribute('x', n.x); text.setAttribute('y', n.y + 1);
      text.setAttribute('class', textClass);
      text.textContent = name;

      const badge = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      badge.setAttribute('x', n.x); badge.setAttribute('y', n.y - 28);
      badge.setAttribute('class', 'order-badge');
      badge.setAttribute('id', `badge-${name}`);

      g.appendChild(circle);
      g.appendChild(text);
      g.appendChild(badge);
      svg.appendChild(g);
    });

    // 임시 지정 위치 가이드 포인트
    if (tempClickCoords) {
      const tempCircle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      tempCircle.setAttribute('cx', tempClickCoords.x);
      tempCircle.setAttribute('cy', tempClickCoords.y);
      tempCircle.setAttribute('class', 'temp-point');
      svg.appendChild(tempCircle);
    }
  }

  function updateUIControls() {
    const fromSel = document.getElementById('from-node');
    const toSel = document.getElementById('to-node');
    const nodeKeys = Object.keys(nodes);

    fromSel.innerHTML = nodeKeys.map(k => `<option value="${k}">${k}</option>`).join('');
    toSel.innerHTML = nodeKeys.map(k => `<option value="${k}">${k}</option>`).join('');

    // 장소 목록 편집 UI
    const nodeListDiv = document.getElementById('node-editor-list');
    nodeListDiv.innerHTML = '';
    nodeKeys.forEach(name => {
      const row = document.createElement('div');
      row.className = 'editor-list-item';
      row.innerHTML = `
        <input type="text" value="${name}" style="width:70px" onchange="renameNode('${name}', this.value)">
        <select onchange="changeNodeType('${name}', this.value)" style="width:75px">
          <option value="normal" ${nodes[name].type === 'normal' ? 'selected' : ''}>일반</option>
          <option value="start" ${nodes[name].type === 'start' ? 'selected' : ''}>출발</option>
          <option value="target" ${nodes[name].type === 'target' ? 'selected' : ''}>도착</option>
        </select>
        <button class="btn-del" onclick="deleteNode('${name}')">✕</button>
      `;
      nodeListDiv.appendChild(row);
    });

    // 이동 경로 목록 편집 UI
    const edgeListDiv = document.getElementById('edge-editor-list');
    edgeListDiv.innerHTML = '';
    edges.forEach((e, idx) => {
      const row = document.createElement('div');
      row.className = 'editor-list-item';
      row.innerHTML = `
        <span>${e.from}-${e.to}:</span>
        <input type="number" step="0.1" value="${e.dist}" style="width:45px" onchange="updateEdge(${idx}, 'dist', this.value)">km
        <input type="number" value="${e.time}" style="width:40px" onchange="updateEdge(${idx}, 'time', this.value)">분
        <button class="btn-del" onclick="deleteEdge(${idx})">✕</button>
      `;
      edgeListDiv.appendChild(row);
    });
  }

  function renameNode(oldName, newName) {
    newName = newName.trim();
    if (!newName || oldName === newName || nodes[newName]) return;

    nodes[newName] = { ...nodes[oldName] };
    delete nodes[oldName];

    edges.forEach(e => {
      if (e.from === oldName) e.from = newName;
      if (e.to === oldName) e.to = newName;
    });

    resetStateOnly();
  }

  function changeNodeType(name, type) {
    if (type === 'start') {
      Object.keys(nodes).forEach(k => { if (nodes[k].type === 'start') nodes[k].type = 'normal'; });
    } else if (type === 'target') {
      Object.keys(nodes).forEach(k => { if (nodes[k].type === 'target') nodes[k].type = 'normal'; });
    }
    nodes[name].type = type;
    resetStateOnly();
  }

  function addNewNode() {
    const name = document.getElementById('new-node-name').value.trim();
    const type = document.getElementById('new-node-type').value;
    const x = parseInt(document.getElementById('new-node-x').value) || 300;
    const y = parseInt(document.getElementById('new-node-y').value) || 200;

    if (!name) { alert('장소 이름을 입력해주세요.'); return; }
    if (nodes[name]) { alert('이미 존재하는 장소 이름입니다.'); return; }

    if (type === 'start') {
      Object.keys(nodes).forEach(k => { if (nodes[k].type === 'start') nodes[k].type = 'normal'; });
    } else if (type === 'target') {
      Object.keys(nodes).forEach(k => { if (nodes[k].type === 'target') nodes[k].type = 'normal'; });
    }

    nodes[name] = { x, y, type };
    document.getElementById('new-node-name').value = '';
    tempClickCoords = null;
    resetStateOnly();
  }

  function deleteNode(name) {
    delete nodes[name];
    edges = edges.filter(e => e.from !== name && e.to !== name);
    resetStateOnly();
  }

  function updateEdge(idx, key, val) {
    edges[idx][key] = parseFloat(val) || 0;
    resetStateOnly();
  }

  function addEdge() {
    const from = document.getElementById('from-node').value;
    const to = document.getElementById('to-node').value;
    const dist = parseFloat(document.getElementById('input-dist').value) || 0.5;
    const time = parseInt(document.getElementById('input-time').value) || 5;

    if (!from || !to || from === to) { alert('서로 다른 장소를 선택해 주세요.'); return; }

    const existingIdx = edges.findIndex(e => (e.from === from && e.to === to) || (e.from === to && e.to === from));
    if (existingIdx >= 0) {
      edges[existingIdx] = { from, to, dist, time };
    } else {
      edges.push({ from, to, dist, time });
    }
    resetStateOnly();
  }

  function deleteEdge(idx) {
    edges.splice(idx, 1);
    resetStateOnly();
  }

  function getStartAndTarget() {
    let start = Object.keys(nodes).find(k => nodes[k].type === 'start') || Object.keys(nodes)[0];
    let target = Object.keys(nodes).find(k => nodes[k].type === 'target') || Object.keys(nodes)[Object.keys(nodes).length - 1];
    return { start, target };
  }

  function selectAlgorithm(algo) {
    resetStateOnly();
    currentAlgo = algo;

    document.getElementById('btn-step').disabled = false;
    document.getElementById('btn-auto').disabled = false;

    if (algo === 'DFS') {
      document.getElementById('algo-type').innerText = '깊이 우선 탐색 (DFS)';
      generateStepsDFS();
    } else if (algo === 'BFS') {
      document.getElementById('algo-type').innerText = '너비 우선 탐색 (BFS)';
      generateStepsBFS();
    } else if (algo === 'TIME') {
      document.getElementById('algo-type').innerText = '⏱️ 최단 시간 경로';
      generateShortestPath('time');
      startAutoPlay();
      return;
    } else if (algo === 'DIST') {
      document.getElementById('algo-type').innerText = '📏 최단 거리 경로';
      generateShortestPath('dist');
      startAutoPlay();
      return;
    }
  }

  function generateStepsDFS() {
    steps = [];
    let visited = [];
    const { start, target } = getStartAndTarget();
    let stack = [start];

    while (stack.length > 0) {
      let curr = stack.pop();
      if (!visited.includes(curr)) {
        visited.push(curr);
        steps.push({ current: curr, visited: [...visited], costInfo: '-' });
        if (curr === target) break;
        (adjList[curr] || []).forEach(nbr => {
          if (!visited.includes(nbr.to) && !stack.includes(nbr.to)) stack.push(nbr.to);
        });
      }
    }
  }

  function generateStepsBFS() {
    steps = [];
    let visited = [];
    const { start, target } = getStartAndTarget();
    let queue = [start];

    while (queue.length > 0) {
      let curr = queue.shift();
      if (!visited.includes(curr)) {
        visited.push(curr);
        steps.push({ current: curr, visited: [...visited], costInfo: '-' });
        if (curr === target) break;
        (adjList[curr] || []).forEach(nbr => {
          if (!visited.includes(nbr.to) && !queue.includes(nbr.to)) queue.push(nbr.to);
        });
      }
    }
  }

  function generateShortestPath(type) {
    steps = [];
    const { start, target } = getStartAndTarget();
    let dists = {}, prev = {}, unvisited = Object.keys(nodes);
    unvisited.forEach(node => { dists[node] = Infinity; prev[node] = null; });
    dists[start] = 0;

    while (unvisited.length > 0) {
      unvisited.sort((a, b) => dists[a] - dists[b]);
      let curr = unvisited.shift();
      if (dists[curr] === Infinity || curr === target) break;

      adjList[curr].forEach(edge => {
        if (unvisited.includes(edge.to)) {
          let weight = (type === 'time') ? edge.time : edge.dist;
          let alt = dists[curr] + weight;
          if (alt < dists[edge.to]) {
            dists[edge.to] = alt;
            prev[edge.to] = curr;
          }
        }
      });
    }

    let path = [];
    let curr = target;
    while (curr) { path.unshift(curr); curr = prev[curr]; }

    if (path[0] !== start) {
      alert(`'${start}'에서 '${target}'(으)로 갈 수 있는 연결 경로가 없습니다! 연결을 먼저 추가해주세요.`);
      resetStateOnly();
      return;
    }

    let accumTime = 0, accumDist = 0;
    for (let i = 0; i < path.length; i++) {
      let node = path[i];
      if (i > 0) {
        let edge = adjList[path[i-1]].find(e => e.to === node);
        accumTime += edge.time; accumDist += edge.dist;
      }
      let costStr = (type === 'time') ? `누적 시간: ${accumTime}분` : `누적 거리: ${accumDist.toFixed(1)}km`;
      steps.push({
        current: node,
        visited: path.slice(0, i + 1),
        costInfo: costStr,
        isTarget: (node === target),
        summary: `총 시간: ${accumTime}분 | 총 거리: ${accumDist.toFixed(1)}km`
      });
    }
  }

  function nextStep() {
    if (stepIndex >= steps.length) {
      clearInterval(timer);
      timer = null;
      document.getElementById('btn-auto').innerText = '⏩ 자동 재생';
      return;
    }

    const step = steps[stepIndex];
    Object.keys(nodes).forEach(k => {
      const circle = document.getElementById(`node-${k}`);
      if (circle) circle.classList.remove('current');
    });

    const currCircle = document.getElementById(`node-${step.current}`);
    if (currCircle) currCircle.classList.add('current', 'visited');

    const badge = document.getElementById(`badge-${step.current}`);
    if (badge) badge.textContent = `${stepIndex + 1}번째`;

    document.getElementById('current-node').innerText = step.current;
    document.getElementById('path-history').innerText = step.visited.join(' ➔ ');
    document.getElementById('total-cost').innerText = step.costInfo;

    if (step.isTarget) {
      document.getElementById('info-card').innerText = `🎉 도착지 완료! (${step.summary || step.visited.length + '단계 이동'})`;
      document.getElementById('btn-step').disabled = true;
      document.getElementById('btn-auto').disabled = true;
      clearInterval(timer);
      timer = null;
      document.getElementById('btn-auto').innerText = '⏩ 자동 재생';
    }
    stepIndex++;
  }

  function startAutoPlay() {
    clearInterval(timer);
    document.getElementById('btn-auto').innerText = '⏸️ 일시 정지';
    nextStep();
    timer = setInterval(() => {
      if (stepIndex >= steps.length) {
        clearInterval(timer);
        timer = null;
        document.getElementById('btn-auto').innerText = '⏩ 자동 재생';
      } else {
        nextStep();
      }
    }, 900);
  }

  function toggleAuto() {
    if (timer) {
      clearInterval(timer);
      timer = null;
      document.getElementById('btn-auto').innerText = '⏩ 자동 재생';
    } else {
      startAutoPlay();
    }
  }

  // 화면 상태만 초기화
  function resetStateOnly() {
    clearInterval(timer);
    timer = null;
    stepIndex = 0;
    steps = [];
    currentAlgo = null;

    document.getElementById('algo-type').innerText = '선택되지 않음';
    document.getElementById('current-node').innerText = '-';
    document.getElementById('path-history').innerText = '-';
    document.getElementById('total-cost').innerText = '-';
    document.getElementById('info-card').innerText = '💡 원하는 장소와 경로를 자유롭게 추가해보세요.';

    document.getElementById('btn-step').disabled = true;
    document.getElementById('btn-auto').disabled = true;
    document.getElementById('btn-auto').innerText = '⏩ 자동 재생';

    drawGraph();
  }

  drawGraph();
</script>

</body>
