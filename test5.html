<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>분류 모델 평가 실습</title>
    <style>
        body {
            font-family: 'Malgun Gothic', sans-serif;
            max-width: 800px;
            margin: 30px auto;
            padding: 20px;
            background-color: #f9f9f9;
            color: #333;
        }
        h2 {
            color: #2c3e50;
            border-bottom: 2px solid #3498db;
            padding-bottom: 10px;
        }
        .card {
            background: #fff;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            text-align: center;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 10px;
        }
        th {
            background-color: #f2f2f2;
        }
        .data-table td {
            font-weight: bold;
            font-size: 18px;
        }
        .matrix-table input {
            width: 60px;
            padding: 5px;
            text-align: center;
            font-size: 16px;
        }
        .metric-box {
            margin-bottom: 15px;
        }
        .metric-box label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .metric-box input {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            font-size: 15px;
        }
        .btn-container {
            text-align: center;
            margin-top: 20px;
        }
        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #2980b9;
        }
        #result-msg {
            margin-top: 15px;
            font-weight: bold;
            text-align: center;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>5. 분류 모델 진단 평가 실습</h2>
        <p><strong>조건:</strong> ⛵ = T(양성), 🛩️ = F(음성)</p>
        <p>분류 모델을 활용하여 여행시 교통수단 상태를  예측한다.</p>
        <p>아래의 실제값과 모델 예측 결과 데이터를 바탕으로 혼동 행렬을 완성하고, 평가 지표를 계산하여 입력하세요.</p>
        
        <!-- 데이터 테이블 -->
        <table class="data-table">
            <tr>
                <th>실제</th>
                <td>⛵</td><td>🛩️</td><td>🛩️</td><td>⛵</td><td>🛩️</td><td>⛵</td><td>🛩️</td><td>🛩️</td><td>⛵</td><td>⛵</td><td>⛵</td><td>🛩️</td>
            </tr>
            <tr>
                <th>모델예측</th>
                <td>🛩️</td><td>⛵</td><td>🛩️</td><td>🛩️</td><td>🛩️</td><td>🛩️</td><td>⛵</td><td>⛵</td><td>🛩️</td><td>🛩️</td><td>⛵</td><td>⛵</td>
            </tr>
        </table>
    </div>

    <div class="card">
        <h3>혼동 행렬 (Confusion Matrix) 완성</h3>
        <table class="matrix-table">
            <tr>
                <td></td>
                <th>예측값: T</th>
                <th>예측값: F</th>
            </tr>
            <tr>
                <th>실제값: T</th>
                <td><input type="number" id="matrix-tt" placeholder=""></td>
                <td><input type="number" id="matrix-tf" placeholder=""></td>
            </tr>
            <tr>
                <th>실제값: F</th>
                <td><input type="number" id="matrix-ft" placeholder=""></td>
                <td><input type="number" id="matrix-ff" placeholder=""></td>
            </tr>
        </table>
    </div>
   
    <div class="card">
        <h3>성능 평가 지표 입력</h3>
        <div class="metric-box">
            <label for="accuracy">정확도 (Accuracy) - 소수점 둘째 자리까지(반올림하세요)</label>
            <input type="text" id="accuracy" placeholder="값을 입력하세요 ">
        </div>
        <div class="metric-box">
            <label for="precision">정밀도 (Precision)</label>
            <input type="text" id="precision" placeholder="값을 입력하세요">
        </div>
        <div class="metric-box">
            <label for="recall">재현율 (Recall)</label>
            <input type="text" id="recall" placeholder="값을 입력하세요">
        </div>
        <div class="metric-box">
            <label for="f1">F1-Score</label>
            <input type="text" id="f1" placeholder="값을 입력하세요">
        </div>

        <div class="btn-container">
            <button onclick="checkAnswers()">정답 확인하기</button>
        </div>
        <div id="result-msg"></div>
    </div>

<script>
    function checkAnswers() {
        // 1. 혼동 행렬 정답 정의 (총 12개 데이터 기준)
        // TT(TP)=1, TF(FN)=5, FT(FP)=4, FF(TN)=2
        const tt = parseInt(document.getElementById('matrix-tt').value);
        const tf = parseInt(document.getElementById('matrix-tf').value);
        const ft = parseInt(document.getElementById('matrix-ft').value);
        const ff = parseInt(document.getElementById('matrix-ff').value);

        // 2. 성능 평가 지표 입력값 가져오기 및 공백 제거
        const acc = document.getElementById('accuracy').value.trim();
        const prec = document.getElementById('precision').value.trim();
        const rec = document.getElementById('recall').value.trim();
        const f1Score = document.getElementById('f1').value.trim();

        let msg = "";
        let isCorrect = true;

        // 3. 혼동 행렬 값 검증
        if (isNaN(tt) || isNaN(tf) || isNaN(ft) || isNaN(ff)) {
            msg = "⚠️ 혼동 행렬의 모든 빈칸에 숫자를 입력해주세요.";
            isCorrect = false;
        } else if (tt !== 1 || tf !== 5 || ft !== 4 || ff !== 2) {
            msg = "❌ 혼동 행렬의 값이 올바르지 않습니다. ";
            isCorrect = false;
        } 
        // 4. 성능 평가 지표 값 검증
        else if (acc !== "0.25") {
            msg = "❌ 정확도(Accuracy) 값이 올바르지 않습니다.";
            isCorrect = false;
        } else if (prec !== "0.20") {
            msg = "❌ 정밀도(Precision) 값이 올바르지 않습니다.";
            isCorrect = false;
        } else if (rec !== "0.17") {
            msg = "❌ 재현율(Recall) 값이 올바르지 않습니다.";
            isCorrect = false;
        } else if (f1Score !== "0.18") {
            msg = "❌ F1-Score 값이 올바르지 않습니다.";
            isCorrect = false;
        } else {
            msg = "🎉 정답입니다! 혼동 행렬과 모든 평가 지표를 정확하게 맞추셨습니다!";
            isCorrect = true;
        }

        // 결과 메시지 및 색상 적용
        const resultMsgEl = document.getElementById('result-msg');
        resultMsgEl.innerHTML = msg;
        resultMsgEl.style.color = isCorrect ? "#27ae60" : "#e74c3c";
    }
</script>

</body>
</html>
